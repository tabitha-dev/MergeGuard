name: MergeGuard Self Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  self-test:
    runs-on: ubuntu-latest

    env:
      MERGEGUARD_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome

    steps:
      - name: Checkout action repo
        uses: actions/checkout@v5

      - name: Verify runner Chrome
        run: |
          which google-chrome
          google-chrome --version

      - name: Start demo site
        run: |
          python3 -m http.server 4173 --directory examples/demo-site &
          sleep 3

      - name: Run MergeGuard against demo site
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          preview-url: http://127.0.0.1:4173
          mode: deterministic
          fail-on-severity: none

      - name: Upload Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mergeguard-evidence
          path: ./artifacts/
          retention-days: 14
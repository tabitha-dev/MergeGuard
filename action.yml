name: MergeGuard UI

description: Agentic frontend PR reviewer using Playwright browser evidence before merge.

author: Tabitha Khadse

inputs:
  github-token:
    description: GitHub token used to read PR metadata and post comments.
    required: true

  openai-api-key:
    description: Optional OpenAI API key for agentic planning and summarization. Required only when mode=agentic and llm-provider=openai.
    required: false

  rapidapi-key:
    description: Optional RapidAPI key for agentic planning and summarization. Required only when mode=agentic and llm-provider=rapidapi.
    required: false

  rapidapi-host:
    description: RapidAPI host to call when llm-provider=rapidapi.
    required: false
    default: open-ai21.p.rapidapi.com

  rapidapi-endpoint:
    description: RapidAPI endpoint to call when llm-provider=rapidapi. Example: claude3 or conversationllama.
    required: false
    default: claude3

  llm-provider:
    description: LLM provider used when mode=agentic. Options are openai or rapidapi.
    required: false
    default: openai

  preview-url:
    description: Preview deployment URL to test.
    required: true

  mode:
    description: Review mode. Use deterministic or agentic.
    required: false
    default: deterministic

  fail-on-severity:
    description: Minimum severity that should fail the action. Options are none, high, medium, low.
    required: false
    default: high

  artifact-dir:
    description: Local directory where screenshots, traces, logs, and run_summary.json are saved.
    required: false
    default: ./artifacts

  model:
    description: Model name used when mode is agentic.
    required: false
    default: gpt-4o-mini

  comment-marker:
    description: Hidden marker used to update the same PR comment on repeated runs.
    required: false
    default: '<!-- mergeguard-ui-review -->'

runs:
  using: node24
  main: dist/index.js

branding:
  icon: shield
  color: blue

name: MergeGuard UI
description: 'Agentic frontend PR reviewer using Playwright browser evidence'

inputs:
  github-token:
    description: 'GitHub token used to read PR metadata and post comments'
    required: true

  preview-url:
    description: 'Preview deployment URL to test'
    required: true

  mode:
    description: 'Run mode. Options: deterministic or agentic'
    required: false
    default: deterministic

  fail-on-severity:
    description: 'Minimum severity that should fail the check. Options: none, high, medium, low'
    required: false
    default: high

  llm-provider:
    description: 'LLM provider for agentic mode. Options: openai or rapidapi'
    required: false
    default: openai

  openai-api-key:
    description: 'Optional OpenAI API key for agentic planning and summarization'
    required: false

  openai-model:
    description: 'OpenAI model to use for agentic mode'
    required: false
    default: gpt-4o-mini

  rapidapi-key:
    description: 'Optional RapidAPI key for agentic mode'
    required: false

  rapidapi-host:
    description: 'RapidAPI host'
    required: false
    default: open-ai21.p.rapidapi.com

  rapidapi-endpoint:
    description: 'RapidAPI endpoint to call when llm-provider is rapidapi. Example: claude3'
    required: false
    default: claude3

runs:
  using: composite
  steps:
    - name: Install MergeGuard dependencies
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        corepack enable
        corepack prepare pnpm@9 --activate
        pnpm install --no-frozen-lockfile

    - name: Compile MergeGuard source
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        pnpm exec tsc

    - name: Install Playwright browser
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        pnpm exec playwright install chromium --with-deps

    - name: Run MergeGuard
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_PREVIEW_URL: ${{ inputs.preview-url }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        INPUT_LLM_PROVIDER: ${{ inputs.llm-provider }}
        INPUT_OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        INPUT_OPENAI_MODEL: ${{ inputs.openai-model }}
        INPUT_RAPIDAPI_KEY: ${{ inputs.rapidapi-key }}
        INPUT_RAPIDAPI_HOST: ${{ inputs.rapidapi-host }}
        INPUT_RAPIDAPI_ENDPOINT: ${{ inputs.rapidapi-endpoint }}
      run: |
        cd "${{ github.action_path }}"
        node lib/index.js

branding:
  icon: shield
  color: blue
name: MergeGuard UI
description: 'Agentic frontend PR reviewer using Playwright browser evidence'

inputs:
  github-token:
    description: 'GitHub token used to read PR metadata and post comments'
    required: true

  preview-url:
    description: 'Preview deployment URL to test'
    required: true

  mode:
    description: 'Run mode. Options: deterministic or agentic'
    required: false
    default: deterministic

  fail-on-severity:
    description: 'Minimum severity that should fail the check. Options: none, high, medium, low'
    required: false
    default: high

  llm-provider:
    description: 'LLM provider for agentic mode. Options: openai or rapidapi'
    required: false
    default: openai

  openai-api-key:
    description: 'Optional OpenAI API key for agentic planning and summarization'
    required: false

  openai-model:
    description: 'OpenAI model to use for agentic mode'
    required: false
    default: gpt-4o-mini

  rapidapi-key:
    description: 'Optional RapidAPI key for agentic mode'
    required: false

  rapidapi-host:
    description: 'RapidAPI host'
    required: false
    default: open-ai21.p.rapidapi.com

  rapidapi-endpoint:
    description: 'RapidAPI endpoint to call when llm-provider is rapidapi. Example: claude3'
    required: false
    default: claude3

runs:
  using: node24
  main: dist/index.js

branding:
  icon: shield
  color: blue
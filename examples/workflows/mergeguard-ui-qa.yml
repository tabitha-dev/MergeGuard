name: MergeGuard UI QA

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  agentic-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      # Replace this with your preview provider step.
      # For example, Vercel, Netlify, Cloudflare Pages, Render, or a custom deployed URL.
      - name: Export preview URL
        run: echo "PREVIEW_URL=https://example.com" >> "$GITHUB_ENV"

      - name: Run MergeGuard Agent
        uses: tabitha-dev/MergeGuard@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          preview-url: ${{ env.PREVIEW_URL }}
          mode: deterministic
          fail-on-severity: high

      # Optional RapidAPI-powered agentic mode:
      # - name: Run MergeGuard Agent
      #   uses: tabitha-dev/MergeGuard@v1
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     preview-url: ${{ env.PREVIEW_URL }}
      #     mode: agentic
      #     llm-provider: rapidapi
      #     rapidapi-key: ${{ secrets.RAPIDAPI_KEY }}
      #     rapidapi-endpoint: claude3
      #     fail-on-severity: high

      - name: Upload Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mergeguard-evidence
          path: ./artifacts/
          retention-days: 14
